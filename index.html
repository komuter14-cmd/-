<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аренда Авто Узбекистан — Панель Управления</title>
  
  <meta name="description" content="Панель управления бронированием авто по Узбекистану (Ташкент, Самарканд, Бухара).">
  <meta name="keywords" content="аренда авто ташкент, прокат машин узбекистан, авто самарканд, аренда малибу">

  <style>
    :root {
      --bg-main: #0b132b;
      --card-bg: rgba(28, 37, 65, 0.85);
      --accent: #00b4d8;
      --accent-hover: #90e0ef;
      --border-color: rgba(0, 180, 216, 0.25);
      --danger: #ff4d6d;
      --success: #2ec4b6;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1c2541, #0b132b, #070a13);
      color: #f1f5f9;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Форма логина (по центру) */
    .login-container {
      width: 100%;
      max-width: 400px;
    }

    /* Основная панель в виде колонок */
    .dashboard-container {
      display: none;
      width: 100%;
      max-width: 1100px;
      grid-template-columns: 1fr 1.2fr;
      gap: 25px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    h2, h3 {
      margin-top: 0;
      color: #ffffff;
      font-weight: 600;
    }

    .header-bar {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px 25px;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #94a3b8;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(11, 19, 43, 0.7);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }

    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 180, 216, 0.3);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .btn:hover {
      background: linear-gradient(135deg, #90e0ef, #00b4d8);
      color: #0b132b;
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(255, 77, 109, 0.2);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .dateTimeGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Карточки в списке */
    .item-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    .item-box.booked { border-left: 4px solid var(--danger); opacity: 0.75; }
    .item-box.free { border-left: 4px solid var(--success); }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .badge-free { background: rgba(46, 196, 182, 0.15); color: var(--success); border: 1px solid var(--success); }
    .badge-booked { background: rgba(255, 77, 109, 0.15); color: var(--danger); border: 1px solid var(--danger); }

    .owner-box {
      background: rgba(0, 180, 216, 0.08);
      border: 1px solid var(--border-color);
      padding: 18px;
      border-radius: 12px;
      margin-top: 20px;
    }

    @media (max-width: 850px) {
      .dashboard-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Форма входа -->
  <div class="card login-container" id="loginCard">
    <h2 style="text-align: center; margin-bottom: 20px;">🚘 Вход в Управление</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="role">Выберите роль:</label>
        <select id="role">
          <option value="owner">Основатель</option>
          <option value="admin1">Администратор 1</option>
          <option value="admin2">Администратор 2</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" placeholder="••••" required>
      </div>

      <button type="submit" class="btn">Войти в систему</button>
    </form>
  </div>

  <!-- Главная Панель В Виде Колонок -->
  <div class="dashboard-container" id="adminPanel">
    
    <!-- Шапка -->
    <div class="header-bar">
      <h2 id="userRoleTitle" style="margin:0; font-size: 1.3rem;">🚘 Управление Автопарком</h2>
      <button class="btn-danger" onclick="logout()">Выйти</button>
    </div>

    <!-- Левая колонка: Бронирование и Настройки Паролей -->
    <div>
      <div class="card">
        <h3>🔑 Забронировать Автомобиль</h3>
        <form id="bookingForm">
          <div class="form-group">
            <label for="carSelect">Выберите свободную машину:</label>
            <select id="carSelect" required></select>
          </div>
          <div class="dateTimeGrid">
            <div class="form-group">
              <label for="bookDate">Дата брони:</label>
              <input type="date" id="bookDate" required>
            </div>
            <div class="form-group">
              <label for="bookTime">Время брони:</label>
              <input type="time" id="bookTime" required>
            </div>
          </div>
          <button type="submit" class="btn">Забронировать авто</button>
        </form>

        <!-- Блок Основателя -->
        <div class="owner-box" id="ownerControlBlock" style="display: none;">
          <h4 style="margin-top:0; color: var(--accent);">⚙️ Доступ Админов (Основатель)</h4>
          <div class="form-group">
            <label for="targetAdmin">Выберите админа:</label>
            <select id="targetAdmin">
              <option value="admin1">Администратор 1</option>
              <option value="admin2">Администратор 2</option>
            </select>
          </div>
          <div class="form-group">
            <label for="newAdminPass">Новый пароль:</label>
            <input type="password" id="newAdminPass" placeholder="Пароль">
          </div>
          <button type="button" class="btn" onclick="changeAdminPassword()">Изменить пароль</button>
        </div>
      </div>
    </div>

    <!-- Правая колонка: Список авто и Сессии Онлайн -->
    <div>
      <div class="card" style="margin-bottom: 20px;">
        <h3>🚗 Статус Машин</h3>
        <div id="carsList"></div>
      </div>

      <div class="card">
        <h3>🌐 Сессии Онлайн</h3>
        <div id="activeAdminsList"></div>
      </div>
    </div>

  </div>

  <script>
    let passwords = {
      owner: '3112',
      admin1: '3221',
      admin2: '3221'
    };

    let currentUser = null;

    // Автомобили
    let cars = [
      { id: 1, name: "Chevrolet Malibu 2", status: "free", bookingInfo: "" },
      { id: 2, name: "Chevrolet Tracker", status: "free", bookingInfo: "" },
      { id: 3, name: "Chevrolet Gentra", status: "free", bookingInfo: "" },
      { id: 4, name: "Chevrolet Tahoe", status: "free", bookingInfo: "" },
      { id: 5, name: "Chevrolet Traverse", status: "free", bookingInfo: "" }
    ];

    let activeSessions = [];

    // Логин
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const pass = document.getElementById('password').value;

      if (pass === passwords[role]) {
        currentUser = role;
        
        if (!activeSessions.includes(role)) {
          activeSessions.push(role);
        }

        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'grid';

        const roleNames = {
          owner: '👑 Панель Основателя',
          admin1: '🛡️ Панель Админа 1',
          admin2: '🛡️ Панель Админа 2'
        };

        document.getElementById('userRoleTitle').innerText = roleNames[role];
        document.getElementById('ownerControlBlock').style.display = (role === 'owner') ? 'block' : 'none';

        renderCars();
        renderActiveAdmins();
      } else {
        alert('Неверный пароль!');
      }
    });

    function logout() {
      if (currentUser) {
        activeSessions = activeSessions.filter(u => u !== currentUser);
      }
      currentUser = null;
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('password').value = '';
    }

    function kickAdmin(adminRole) {
      activeSessions = activeSessions.filter(u => u !== adminRole);
      alert(`Администратор ${adminRole} кикнут из сессии.`);
      
      if (currentUser === adminRole) {
        logout();
      } else {
        renderActiveAdmins();
      }
    }

    function changeAdminPassword() {
      const target = document.getElementById('targetAdmin').value;
      const newPass = document.getElementById('newAdminPass').value;

      if (!newPass) {
        alert('Введите новый пароль!');
        return;
      }

      passwords[target] = newPass;
      alert(`Пароль для ${target} успешно изменён!`);
      document.getElementById('newAdminPass').value = '';
    }

    // Отрисовка машин
    function renderCars() {
      const carsList = document.getElementById('carsList');
      const carSelect = document.getElementById('carSelect');
      
      carsList.innerHTML = '';
      carSelect.innerHTML = '<option value="">-- Выберите машину --</option>';

      let freeCount = 0;

      cars.forEach(car => {
        const isFree = car.status === 'free';
        const carDiv = document.createElement('div');
        carDiv.className = `item-box ${isFree ? 'free' : 'booked'}`;
        
        carDiv.innerHTML = `
          <div>
            <strong style="font-size:1rem; color:#fff;">${car.name}</strong><br>
            <small style="color:#94a3b8;">${isFree ? 'Свободна к брони' : 'Забронирована: ' + car.bookingInfo}</small>
          </div>
          <span class="badge ${isFree ? 'badge-free' : 'badge-booked'}">
            ${isFree ? 'Свободна' : 'Занята'}
          </span>
        `;
        carsList.appendChild(carDiv);

        if (isFree) {
          freeCount++;
          const option = document.createElement('option');
          option.value = car.id;
          option.textContent = car.name;
          carSelect.appendChild(option);
        }
      });

      if (freeCount === 0) {
        carSelect.innerHTML = '<option value="">Нет свободных машин</option>';
      }
    }

    function renderActiveAdmins() {
      const list = document.getElementById('activeAdminsList');
      list.innerHTML = '';

      activeSessions.forEach(user => {
        const div = document.createElement('div');
        div.className = 'item-box free';
        
        const isSelf = (user === currentUser);
        const canKick = (currentUser === 'owner' && !isSelf);

        div.innerHTML = `
          <div>
            <strong>${user === 'owner' ? '👑 Основатель' : '🛡️️ ' + user}</strong>
            ${isSelf ? ' <small style="color:#2ec4b6;">(Вы)</small>' : ''}
          </div>
          ${canKick ? `<button class="btn-danger" onclick="kickAdmin('${user}')">Кикнуть</button>` : '<span class="badge badge-free">Онлайн</span>'}
        `;
        list.appendChild(div);
      });
    }

    // Бронирование
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const carId = parseInt(document.getElementById('carSelect').value);
      const date = document.getElementById('bookDate').value;
      const time = document.getElementById('bookTime').value;

      if (!carId) {
        alert('Выберите свободную машину!');
        return;
      }

      const car = cars.find(c => c.id === carId);
      if (car) {
        car.status = 'booked';
        car.bookingInfo = `${date} в ${time}`;
        alert(`Машина ${car.name} успешно забронирована на ${date} (${time})`);
        
        document.getElementById('bookingForm').reset();
        renderCars();
      }
    });
  </script>
</body>
</html>
