<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Туры и Гиды по Узбекистану — Панель Управления</title>
  
  <!-- SEO Мета-теги -->
  <meta name="description" content="Панель управления бронированием гидов по Узбекистану (Ташкент, Самарканд, Бухара, Хива).">
  <meta name="keywords" content="туры узбекистан, гиды узбекистан, экскурсии ташкент, самарканд гид, гид бухара, гид хива">

  <style>
    /* Живой анимированный фон */
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a0826);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Модальные карты */
    .card {
      background: rgba(22, 19, 43, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(138, 43, 226, 0.35);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(138, 43, 226, 0.25);
      animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popup {
      0% { opacity: 0; transform: scale(0.8) translateY(-20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .dashboard-card {
      max-width: 700px;
      display: none;
    }

    h2, h3 {
      margin-top: 0;
      text-align: center;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #c4c4c4;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(10, 8, 22, 0.6);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    select:focus, input:focus {
      border-color: #8a2be2;
      box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #8a2be2, #c71585);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(199, 21, 133, 0.4);
    }

    .btn-danger {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-danger:hover {
      background: #bd2130;
    }

    .dateTimeGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Элементы списков */
    .item-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-box.booked { border-left: 4px solid #dc3545; opacity: 0.7; }
    .item-box.free { border-left: 4px solid #28a745; }

    .badge {
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .badge-free { background: rgba(40, 167, 69, 0.2); color: #2ecc71; border: 1px solid #28a745; }
    .badge-booked { background: rgba(220, 53, 69, 0.2); color: #e74c3c; border: 1px solid #dc3545; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .btn-logout {
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid #dc3545;
      color: #ff6b6b;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-logout:hover {
      background: #dc3545;
      color: #fff;
    }

    .owner-only {
      display: none;
      background: rgba(138, 43, 226, 0.1);
      border: 1px solid rgba(138, 43, 226, 0.3);
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Окно Логина по центру -->
  <div class="card" id="loginCard">
    <h2>🔐 Вход в Управление</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="role">Выберите роль:</label>
        <select id="role">
          <option value="owner">Основатель</option>
          <option value="admin1">Администратор 1</option>
          <option value="admin2">Администратор 2</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" placeholder="••••" required>
      </div>

      <button type="submit" class="btn-submit">Войти</button>
    </form>
  </div>

  <!-- Главная Панель Управления -->
  <div class="card dashboard-card" id="adminPanel">
    <div class="header-bar">
      <h2 id="userRoleTitle" style="margin:0;">Панель Управления</h2>
      <button class="btn-logout" onclick="logout()">Выйти</button>
    </div>

    <!-- Блок бронирования гидов -->
    <h3>📅 Бронирование гида</h3>
    <form id="bookingForm">
      <div class="form-group">
        <label for="guideSelect">Выберите свободного гида:</label>
        <select id="guideSelect" required></select>
      </div>
      <div class="dateTimeGrid">
        <div class="form-group">
          <label for="bookDate">Дата:</label>
          <input type="date" id="bookDate" required>
        </div>
        <div class="form-group">
          <label for="bookTime">Время:</label>
          <input type="time" id="bookTime" required>
        </div>
      </div>
      <button type="submit" class="btn-submit">Забронировать гида</button>
    </form>

    <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">

    <!-- Список статусов гидов -->
    <h3>👨‍💼 Статус всех гидов</h3>
    <div id="guidesList"></div>

    <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">

    <!-- Блок Активных Админов Онлайн -->
    <h3>🟢 Активные Сессии (Онлайн)</h3>
    <div id="activeAdminsList"></div>

    <!-- Раздел Управления для Основателя -->
    <div class="owner-only" id="ownerControlBlock">
      <h3 style="color: #d8b4fe;">👑 Настройки доступа (Только Основатель)</h3>
      
      <div class="form-group">
        <label for="targetAdmin">Выберите администратора:</label>
        <select id="targetAdmin">
          <option value="admin1">Администратор 1</option>
          <option value="admin2">Администратор 2</option>
        </select>
      </div>
      <div class="form-group">
        <label for="newAdminPass">Новый пароль:</label>
        <input type="password" id="newAdminPass" placeholder="Введите новый пароль">
      </div>
      <button type="button" class="btn-submit" onclick="changeAdminPassword()">Изменить пароль</button>
    </div>
  </div>

  <script>
    // Пароли по умолчанию
    let passwords = {
      owner: '3112',
      admin1: '3221',
      admin2: '3221'
    };

    let currentUser = null;

    // Список гидов
    let guides = [
      { id: 1, name: "Тимур (Ташкент)", status: "free", bookingInfo: "" },
      { id: 2, name: "Шахноза (Самарканд)", status: "free", bookingInfo: "" },
      { id: 3, name: "Сардор (Бухара)", status: "free", bookingInfo: "" },
      { id: 4, name: "Азиз (Хива)", status: "free", bookingInfo: "" }
    ];

    // Список сессий онлайн
    let activeSessions = [];

    // Вход
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const pass = document.getElementById('password').value;

      if (pass === passwords[role]) {
        currentUser = role;
        
        // Добавляем в активные сессии
        if (!activeSessions.includes(role)) {
          activeSessions.push(role);
        }

        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';

        const roleNames = {
          owner: '👑 Панель Основателя',
          admin1: '🛡️ Панель Админа 1',
          admin2: '🛡️ Панель Админа 2'
        };

        document.getElementById('userRoleTitle').innerText = roleNames[role];

        // Показываем блок управления паролями только для Основателя
        document.getElementById('ownerControlBlock').style.display = (role === 'owner') ? 'block' : 'none';

        renderGuides();
        renderActiveAdmins();
      } else {
        alert('Неверный пароль!');
      }
    });

    // Выход
    function logout() {
      if (currentUser) {
        activeSessions = activeSessions.filter(u => u !== currentUser);
      }
      currentUser = null;
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('password').value = '';
    }

    // Кик администратора (функция Основателя)
    function kickAdmin(adminRole) {
      activeSessions = activeSessions.filter(u => u !== adminRole);
      alert(`Пользователь ${adminRole} заблокирован/выкинут из сессии.`);
      
      if (currentUser === adminRole) {
        logout();
      } else {
        renderActiveAdmins();
      }
    }

    // Изменение пароля администратора
    function changeAdminPassword() {
      const target = document.getElementById('targetAdmin').value;
      const newPass = document.getElementById('newAdminPass').value;

      if (!newPass) {
        alert('Введите новый пароль!');
        return;
      }

      passwords[target] = newPass;
      alert(`Пароль для ${target} успешно изменен!`);
      document.getElementById('newAdminPass').value = '';
    }

    // Отрисовка списка гидов
    function renderGuides() {
      const guidesList = document.getElementById('guidesList');
      const guideSelect = document.getElementById('guideSelect');
      
      guidesList.innerHTML = '';
      guideSelect.innerHTML = '<option value="">-- Выберите гида --</option>';

      let freeCount = 0;

      guides.forEach(guide => {
        const isFree = guide.status === 'free';
        const guideDiv = document.createElement('div');
        guideDiv.className = `item-box ${isFree ? 'free' : 'booked'}`;
        
        guideDiv.innerHTML = `
          <div>
            <strong style="font-size:1.05rem;">${guide.name}</strong><br>
            <small style="color:#b3b3b3;">${isFree ? 'Свободен к бронированию' : 'Забронирован: ' + guide.bookingInfo}</small>
          </div>
          <span class="badge ${isFree ? 'badge-free' : 'badge-booked'}">
            ${isFree ? 'Свободен' : 'Занят'}
          </span>
        `;
        guidesList.appendChild(guideDiv);

        if (isFree) {
          freeCount++;
          const option = document.createElement('option');
          option.value = guide.id;
          option.textContent = guide.name;
          guideSelect.appendChild(option);
        }
      });

      if (freeCount === 0) {
        guideSelect.innerHTML = '<option value="">Нет свободных гидов</option>';
      }
    }

    // Отрисовка активных администраторов
    function renderActiveAdmins() {
      const list = document.getElementById('activeAdminsList');
      list.innerHTML = '';

      if (activeSessions.length === 0) {
        list.innerHTML = '<small style="color:#aaa;">Нет активных сессий</small>';
        return;
      }

      activeSessions.forEach(user => {
        const div = document.createElement('div');
        div.className = 'item-box free';
        
        const isSelf = (user === currentUser);
        const canKick = (currentUser === 'owner' && !isSelf);

        div.innerHTML = `
          <div>
            <strong>${user === 'owner' ? '👑 Основатель' : '🛡️ ' + user}</strong>
            ${isSelf ? ' <small style="color:#2ecc71;">(Вы)</small>' : ''}
          </div>
          ${canKick ? `<button class="btn-danger" onclick="kickAdmin('${user}')">Кикнуть</button>` : '<span class="badge badge-free">Онлайн</span>'}
        `;
        list.appendChild(div);
      });
    }

    // Бронирование
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const guideId = parseInt(document.getElementById('guideSelect').value);
      const date = document.getElementById('bookDate').value;
      const time = document.getElementById('bookTime').value;

      if (!guideId) {
        alert('Выберите свободного гида!');
        return;
      }

      const guide = guides.find(g => g.id === guideId);
      if (guide) {
        guide.status = 'booked';
        guide.bookingInfo = `${date} в ${time}`;
        alert(`Гид ${guide.name} забронирован на ${date} (${time})`);
        
        document.getElementById('bookingForm').reset();
        renderGuides();
      }
    });
  </script>
</body>
</html>
