<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гиды Узбекистана</title>
  <style>
    /* Живой анимированный фон */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a0826);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Модальное окно с анимированным появлением */
    .login-card {
      background: rgba(22, 19, 43, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(138, 43, 226, 0.3);
      border-radius: 16px;
      padding: 30px;
      width: 320px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(138, 43, 226, 0.2);
      animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-align: center;
    }

    @keyframes popup {
      0% { opacity: 0; transform: scale(0.7) translateY(-30px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.3rem;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #b3b3b3;
    }

    select, input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(10, 8, 22, 0.6);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    select:focus, input[type="password"]:focus {
      border-color: #8a2be2;
      box-shadow: 0 0 8px rgba(138, 43, 226, 0.5);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #8a2be2, #c71585);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(199, 21, 133, 0.4);
    }

    .btn-cancel {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #dc3545;
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-cancel:hover {
      background: #bd2130;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🔐 Вход в Управление</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="role">Выберите роль:</label>
        <select id="role">
          <option value="owner">Основатель</option>
          <option value="admin">Администратор</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" placeholder="••••" required>
      </div>

      <button type="submit" class="btn-submit">Войти</button>
      <button type="button" class="btn-cancel" onclick="alert('Отмена')">Отмена</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;

      // Проверка паролей напрямую
      if (role === 'owner' && password === '3112') {
        alert('Успешный вход в роли Основателя!');
        // Перенаправление или вызов функции для основателя
      } else if (role === 'admin' && password === '3221') {
        alert('Успешный вход в роли Администратора!');
        // Перенаправление или вызов функции для админа
      } else {
        alert('Неверный пароль!');
      }
    });
  </script>
</body>
</html>
