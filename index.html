<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление Турами и Гидами — Узбекистан</title>

  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.9);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: rgba(56, 189, 248, 0.2);
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1e293b, #0f172a, #020617);
      color: #f8fafc;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .dashboard-container {
      display: none;
      width: 100%;
      max-width: 1200px;
      grid-template-columns: 1fr 1.2fr;
      gap: 20px;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
    }

    h2, h3, h4 {
      margin-top: 0;
      color: #fff;
    }

    .header-bar {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px 25px;
      border-radius: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    select, input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .btn-success {
      background: var(--success);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .dateTimeGrid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .item-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-box.booked { border-left: 4px solid var(--danger); }
    .item-box.free { border-left: 4px solid var(--success); }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .badge-free { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-booked { background: rgba(244, 63, 94, 0.2); color: var(--danger); }

    .generated-info {
      background: rgba(56, 189, 248, 0.1);
      border: 1px dashed var(--accent);
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-family: monospace;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    th, td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    th { color: #94a3b8; }

    @media (max-width: 900px) {
      .dashboard-container { grid-template-columns: 1fr; }
      .dateTimeGrid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Окно Входа -->
  <div class="card login-container" id="loginCard">
    <h2 style="text-align:center;">🔒 Авторизация</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>Логин:</label>
        <input type="text" id="loginInput" placeholder="Введите логин" required>
      </div>

      <div class="form-group">
        <label>Пароль:</label>
        <input type="password" id="passInput" placeholder="••••••" required>
      </div>

      <button type="submit" class="btn">Войти</button>
    </form>
  </div>

  <!-- Главный Интерфейс -->
  <div class="dashboard-container" id="mainDashboard">
    
    <!-- Шапка -->
    <div class="header-bar">
      <div>
        <h3 id="userRoleTitle" style="margin:0;">Панель</h3>
        <small id="userSubTitle" style="color:#94a3b8;"></small>
      </div>
      <button class="btn-danger" onclick="logout()">Выйти</button>
    </div>

    <!-- Левая Колонка -->
    <div>
      <!-- Блок Записи (Для Основателя и Админа) -->
      <div class="card" id="bookingCard">
        <h3>📅 Бронирование Гида</h3>
        <form id="bookingForm">
          <div class="form-group">
            <label>Выберите гида:</label>
            <select id="guideSelect" required></select>
          </div>
          <div class="form-group">
            <label>Имя клиента / Контакт:</label>
            <input type="text" id="clientName" placeholder="Иван (+998...)" required>
          </div>
          <div class="dateTimeGrid">
            <div class="form-group">
              <label>Дата:</label>
              <input type="date" id="bookDate" required>
            </div>
            <div class="form-group">
              <label>Время:</label>
              <input type="time" id="bookTime" required>
            </div>
            <div class="form-group">
              <label>Часов:</label>
              <input type="number" id="bookHours" min="1" max="24" value="2" required>
            </div>
          </div>
          <button type="submit" class="btn">Забронировать</button>
        </form>
      </div>

      <!-- Блок Генерации Аккаунтов (Только Основатель) -->
      <div class="card" id="ownerCreateCard" style="display:none;">
        <h3 style="color:var(--accent);">👑 Генерация Нового Аккаунта</h3>
        <div class="form-group">
          <label>Тип Роли:</label>
          <select id="newRoleType">
            <option value="guide">Гид</option>
            <option value="admin">Администратор</option>
          </select>
        </div>
        <div class="form-group">
          <label>Имя / Название (например: Тимур Ташкент):</label>
          <input type="text" id="newName" placeholder="Введите имя">
        </div>
        <button class="btn" onclick="generateAccount()">⚡ Сгенерировать Логин и Пароль</button>

        <div class="generated-info" id="accountResult" style="display:none;">
          <div><b>Логин:</b> <span id="resLogin"></span></div>
          <div><b>Пароль:</b> <span id="resPass"></span></div>
        </div>
      </div>
    </div>

    <!-- Правая Колонка -->
    <div>
      <!-- Для Гида: Его индивидуальное расписание -->
      <div class="card" id="guideScheduleCard" style="display:none;">
        <h3>⏳ Мои Бронирования по Часам</h3>
        <div id="guideMyBookings"></div>
      </div>

      <!-- Общий статус всех гидов -->
      <div class="card" id="allGuidesCard">
        <h3>👨‍💼 Статус всех Гидов</h3>
        <div id="guidesList"></div>
      </div>

      <!-- База пользователей и Паролей (Только Основатель) -->
      <div class="card" id="ownerUsersCard" style="display:none;">
        <h3 style="color:var(--accent);">👥 База Пользователей и Доступы</h3>
        <table>
          <thead>
            <tr>
              <th>Логин</th>
              <th>Роль</th>
              <th>Пароль</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>

      <!-- Онлайн Сессии -->
      <div class="card">
        <h3>🌐 Активные Сессии</h3>
        <div id="activeSessionsList"></div>
      </div>
    </div>

  </div>

  <script>
    // База данных аккаунтов
    let users = [
      { login: 'owner', pass: '3112', role: 'owner', name: 'Главный Основатель' },
      { login: 'admin1', pass: '3221', role: 'admin', name: 'Администратор 1' },
      { login: 'guide_timur', pass: '88412', role: 'guide', name: 'Тимур (Ташкент)' },
      { login: 'guide_sardor', pass: '77123', role: 'guide', name: 'Сардор (Самарканд)' }
    ];

    let bookings = [];
    let activeSessions = [];
    let currentUser = null;

    // Авторизация
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const login = document.getElementById('loginInput').value.trim();
      const pass = document.getElementById('passInput').value.trim();

      const user = users.find(u => u.login === login && u.pass === pass);

      if (user) {
        currentUser = user;
        if (!activeSessions.includes(user.login)) {
          activeSessions.push(user.login);
        }

        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'grid';

        setupDashboard();
      } else {
        alert('Неверный логин или пароль!');
      }
    });

    function setupDashboard() {
      document.getElementById('userRoleTitle').innerText = `${currentUser.name}`;
      document.getElementById('userSubTitle').innerText = `Роль: ${currentUser.role.toUpperCase()}`;

      // Показ блоков в зависимости от роли
      const isOwner = currentUser.role === 'owner';
      const isGuide = currentUser.role === 'guide';

      document.getElementById('ownerCreateCard').style.display = isOwner ? 'block' : 'none';
      document.getElementById('ownerUsersCard').style.display = isOwner ? 'block' : 'none';
      
      document.getElementById('bookingCard').style.display = isGuide ? 'none' : 'block';
      document.getElementById('guideScheduleCard').style.display = isGuide ? 'block' : 'none';

      renderGuides();
      renderActiveSessions();

      if (isOwner) renderUsersTable();
      if (isGuide) renderGuideSchedule();
    }

    function logout() {
      if (currentUser) {
        activeSessions = activeSessions.filter(l => l !== currentUser.login);
      }
      currentUser = null;
      document.getElementById('mainDashboard').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('loginInput').value = '';
      document.getElementById('passInput').value = '';
    }

    // Генерация аккаунта Основателем
    function generateAccount() {
      const name = document.getElementById('newName').value.trim();
      const type = document.getElementById('newRoleType').value;

      if (!name) {
        alert('Введите имя!');
        return;
      }

      const generatedLogin = (type === 'guide' ? 'guide_' : 'admin_') + Math.floor(100 + Math.random() * 900);
      const generatedPass = Math.floor(100000 + Math.random() * 900000).toString();

      users.push({
        login: generatedLogin,
        pass: generatedPass,
        role: type,
        name: name
      });

      document.getElementById('resLogin').innerText = generatedLogin;
      document.getElementById('resPass').innerText = generatedPass;
      document.getElementById('accountResult').style.display = 'block';

      renderUsersTable();
      renderGuides();
      document.getElementById('newName').value = '';
    }

    // Бронирование
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const guideLogin = document.getElementById('guideSelect').value;
      const client = document.getElementById('clientName').value;
      const date = document.getElementById('bookDate').value;
      const time = document.getElementById('bookTime').value;
      const hours = document.getElementById('bookHours').value;

      bookings.push({
        id: Date.now(),
        guideLogin: guideLogin,
        client: client,
        date: date,
        time: time,
        hours: hours
      });

      alert('Бронирование успешно создано!');
      document.getElementById('bookingForm').reset();

      renderGuides();
      if (currentUser.role === 'guide') renderGuideSchedule();
    });

    // Отрисовка статусов гидов
    function renderGuides() {
      const guidesList = document.getElementById('guidesList');
      const guideSelect = document.getElementById('guideSelect');

      guidesList.innerHTML = '';
      if (guideSelect) guideSelect.innerHTML = '<option value="">-- Выберите гида --</option>';

      const guideUsers = users.filter(u => u.role === 'guide');

      guideUsers.forEach(g => {
        const activeBooking = bookings.find(b => b.guideLogin === g.login);
        const isFree = !activeBooking;

        const div = document.createElement('div');
        div.className = `item-box ${isFree ? 'free' : 'booked'}`;
        div.innerHTML = `
          <div>
            <strong>${g.name}</strong><br>
            <small style="color:#94a3b8;">
              ${isFree ? 'Свободен' : `Занят: ${activeBooking.date} в ${activeBooking.time} (${activeBooking.hours} ч.)`}
            </small>
          </div>
          <span class="badge ${isFree ? 'badge-free' : 'badge-booked'}">${isFree ? 'Свободен' : 'Занят'}</span>
        `;
        guidesList.appendChild(div);

        if (guideSelect && isFree) {
          const opt = document.createElement('option');
          opt.value = g.login;
          opt.textContent = g.name;
          guideSelect.appendChild(opt);
        }
      });
    }

    // Расписание гида
    function renderGuideSchedule() {
      const container = document.getElementById('guideMyBookings');
      container.innerHTML = '';

      const myBookings = bookings.filter(b => b.guideLogin === currentUser.login);

      if (myBookings.length === 0) {
        container.innerHTML = '<small style="color:#94a3b8;">У вас пока нет активных броней.</small>';
        return;
      }

      myBookings.forEach(b => {
        const div = document.createElement('div');
        div.className = 'item-box booked';
        div.innerHTML = `
          <div>
            <strong>📅 Дата: ${b.date}</strong> | <b>🕒 Время: ${b.time}</b> (${b.hours} час.)<br>
            <small>Клиент: ${b.client}</small>
          </div>
          <button class="btn-success" onclick="completeBooking(${b.id})">Завершить</button>
        `;
        container.appendChild(div);
      });
    }

    function completeBooking(id) {
      bookings = bookings.filter(b => b.id !== id);
      renderGuideSchedule();
      renderGuides();
    }

    // Таблица юзеров (Основатель)
    function renderUsersTable() {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      users.forEach(u => {
        if (u.role === 'owner') return;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${u.login}</td>
          <td>${u.role}</td>
          <td><input type="text" value="${u.pass}" style="padding:3px; font-size:0.8rem;" onchange="updatePass('${u.login}', this.value)"></td>
          <td><button class="btn-danger" onclick="deleteUser('${u.login}')">Удалить</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updatePass(login, newPass) {
      const u = users.find(x => x.login === login);
      if (u) {
        u.pass = newPass;
        alert(`Пароль для ${login} обновлён!`);
      }
    }

    function deleteUser(login) {
      users = users.filter(u => u.login !== login);
      renderUsersTable();
      renderGuides();
    }

    function renderActiveSessions() {
      const list = document.getElementById('activeSessionsList');
      list.innerHTML = '';

      activeSessions.forEach(login => {
        const u = users.find(x => x.login === login);
        const div = document.createElement('div');
        div.className = 'item-box free';

        const canKick = currentUser.role === 'owner' && login !== currentUser.login;

        div.innerHTML = `
          <div>
            <strong>${u ? u.name : login}</strong> <small>(${login})</small>
          </div>
          ${canKick ? `<button class="btn-danger" onclick="kick('${login}')">Кикнуть</button>` : '<span class="badge badge-free">Онлайн</span>'}
        `;
        list.appendChild(div);
      });
    }

    function kick(login) {
      activeSessions = activeSessions.filter(l => l !== login);
      renderActiveSessions();
    }
  </script>
</body>
</html>
