<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гиды Узбекистана — Панель Управления</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a0826);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(22, 19, 43, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(138, 43, 226, 0.3);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(138, 43, 226, 0.2);
      animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin-bottom: 20px;
    }

    @keyframes popup {
      0% { opacity: 0; transform: scale(0.7) translateY(-30px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    h2, h3 {
      margin-top: 0;
      text-align: center;
      color: #e0e0e0;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #b3b3b3;
    }

    select, input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(10, 8, 22, 0.6);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      border-color: #8a2be2;
      box-shadow: 0 0 8px rgba(138, 43, 226, 0.5);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #8a2be2, #c71585);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 5px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(199, 21, 133, 0.4);
    }

    .guide-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #28a745;
    }

    .guide-item.booked {
      border-left-color: #dc3545;
      opacity: 0.6;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    .badge-free { background: #28a745; color: #fff; }
    .badge-booked { background: #dc3545; color: #fff; }

    #adminPanel { display: none; }
  </style>
</head>
<body>

  <!-- Окно Авторизации -->
  <div class="card" id="loginCard">
    <h2>🔐 Вход в Управление</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="role">Выберите роль:</label>
        <select id="role">
          <option value="owner">Основатель</option>
          <option value="admin">Администратор</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" placeholder="••••" required>
      </div>
      <button type="submit" class="btn">Войти</button>
    </form>
  </div>

  <!-- Панель Бронирования (доступна после входа) -->
  <div class="card" id="adminPanel">
    <h2 id="userRoleTitle">Панель Управления</h2>
    
    <h3>📅 Бронирование гида</h3>
    <form id="bookingForm">
      <div class="form-group">
        <label for="guideSelect">Выберите свободного гида:</label>
        <select id="guideSelect" required></select>
      </div>
      <div class="form-group">
        <label for="bookDate">Дата бронирования:</label>
        <input type="date" id="bookDate" required>
      </div>
      <div class="form-group">
        <label for="bookTime">Время бронирования:</label>
        <input type="time" id="bookTime" required>
      </div>
      <button type="submit" class="btn">Забронировать гида</button>
    </form>

    <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">

    <h3>👨‍💼 Список Гидов</h3>
    <div id="guidesList"></div>
  </div>

  <script>
    // Исходный список гидов
    let guides = [
      { id: 1, name: "Тимур (Ташкент)", status: "free", bookingInfo: "" },
      { id: 2, name: "Шахноза (Самарканд)", status: "free", bookingInfo: "" },
      { id: 3, name: "Сардор (Бухара)", status: "free", bookingInfo: "" },
      { id: 4, name: "Азиз (Хива)", status: "free", bookingInfo: "" }
    ];

    // Вход в систему
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const password = document.getElementById('password').value;

      if ((role === 'owner' && password === '3112') || (role === 'admin' && password === '3221')) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('userRoleTitle').innerText = role === 'owner' ? '👑 Панель Основателя' : '🛡️ Панель Администратора';
        renderGuides();
      } else {
        alert('Неверный пароль!');
      }
    });

    // Отрисовка списка гидов и выпадающего списка
    function renderGuides() {
      const guidesList = document.getElementById('guidesList');
      const guideSelect = document.getElementById('guideSelect');
      
      guidesList.innerHTML = '';
      guideSelect.innerHTML = '<option value="">-- Выберите гида --</option>';

      let freeCount = 0;

      guides.forEach(guide => {
        // Карточка гида в общем списке
        const guideDiv = document.createElement('div');
        guideDiv.className = `guide-item ${guide.status === 'booked' ? 'booked' : ''}`;
        
        const isFree = guide.status === 'free';
        guideDiv.innerHTML = `
          <div>
            <strong>${guide.name}</strong><br>
            <small>${isFree ? 'Готов к экскурсиям' : 'Занят: ' + guide.bookingInfo}</small>
          </div>
          <span class="badge ${isFree ? 'badge-free' : 'badge-booked'}">
            ${isFree ? 'Свободен' : 'Забронирован'}
          </span>
        `;
        guidesList.appendChild(guideDiv);

        // Фильтрация: добавляем в список для бронирования ТОЛЬКО свободных гидов
        if (isFree) {
          freeCount++;
          const option = document.createElement('option');
          option.value = guide.id;
          option.textContent = guide.name;
          guideSelect.appendChild(option);
        }
      });

      if (freeCount === 0) {
        guideSelect.innerHTML = '<option value="">Нет свободных гидов</option>';
      }
    }

    // Обработка бронирования
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const guideId = parseInt(document.getElementById('guideSelect').value);
      const date = document.getElementById('bookDate').value;
      const time = document.getElementById('bookTime').value;

      if (!guideId) {
        alert('Выберите свободного гида!');
        return;
      }

      // Находим гида и меняем его статус
      const guide = guides.find(g => g.id === guideId);
      if (guide) {
        guide.status = 'booked';
        guide.bookingInfo = `${date} в ${time}`;
        alert(`Гид ${guide.name} успешно забронирован на ${date} (${time})!`);
        
        // Сбрасываем форму и обновляем отображение
        document.getElementById('bookingForm').reset();
        renderGuides();
      }
    });
  </script>
</body>
</html>
